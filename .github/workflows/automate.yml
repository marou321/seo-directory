# .github/workflows/automate.yml
name: Weekly Programmatic SEO Data Pipeline

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo-database:
    name: Enrich & Commit SQLite Database
    runs-on: ubuntu-latest
    if: github.repository == 'marou321/seo-directory'

    steps:
      - name: Checkout marou321/seo-directory repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies & initialize SQLite schema
        run: |
          npm ci || npm install
          node database.js

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OpenAI Enrichment & High-Volume Trend Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          DB_PATH: data.db
        run: |
          python generate_pages.py
          python pipeline.py

      - name: Checkpoint SQLite WAL into main data.db file
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('data.db'); conn.execute('PRAGMA wal_checkpoint(TRUNCATE);'); conn.execute('PRAGMA journal_mode=DELETE;'); conn.close()"

      - name: Commit and push updated data.db and generated templates to main branch
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch data.db-shm data.db-wal
          rm -f data.db-shm data.db-wal
          git add data.db views/generated/
          if git diff --staged --quiet; then
            echo "No changes detected in data.db or views/generated/."
          else
            git commit -m "chore(data): automated programmatic SEO database & trend pages update [skip ci]"
            git push origin HEAD:main
          fi
